<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6fafd" />
    <script>(function(d){d.classList.add("js");try{if(location.pathname==="/"&&!matchMedia("(prefers-reduced-motion: reduce)").matches)d.classList.add("intro")}catch(e){}})(document.documentElement)</script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Fonts are served from this site (public/fonts), preloaded so text paints in the right font at once. -->
    <link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Urdu font (letters used on the site only): defined after the page has loaded so its download never competes
         with the first paint. Rebuild the file with: node scripts/fetch-fonts.mjs -->
    <script>
      addEventListener('load', function () {
        setTimeout(function () {
          var s = document.createElement('style')
          s.textContent = '@font-face{font-family:"Noto Nastaliq Urdu";font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/urdu-subset.woff2) format("woff2")}'
          document.head.appendChild(s)
        }, 400)
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
